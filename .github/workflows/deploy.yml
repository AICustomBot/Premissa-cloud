name: Deploy

# Option A topology:
#   Operator console -> published by Google AI Studio (static, no secrets)
#   API              -> this workflow, Cloud Run, us-central1
#   Firestore rules  -> this workflow, database premissadb
#
# Every credential is attached as a Secret Manager reference. A literal env
# value would be copied into Cloud Audit Logs, which cannot be redacted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  FIRESTORE_DATABASE_ID: premissadb
  API_SERVICE: permissa-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Fail fast on missing configuration
        run: |
          missing=""
          [ -n "${{ secrets.GCP_PROJECT_ID }}" ] || missing="$missing GCP_PROJECT_ID"
          [ -n "${{ secrets.ARTIFACT_REGISTRY }}" ] || missing="$missing ARTIFACT_REGISTRY"
          [ -n "${{ vars.CONSOLE_ORIGIN }}" ] || missing="$missing CONSOLE_ORIGIN"
          if [ -n "$missing" ]; then
            echo "Missing required configuration:$missing" >&2
            exit 1
          fi

      # `gcloud builds submit --tag` requires a Dockerfile at the root of the
      # build context. Ours lives at apps/api/Dockerfile while the context must
      # remain the repository root, so the build is expressed as a config.
      - name: Build and push API image
        run: |
          gcloud builds submit \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$GCP_REGION" \
            --config cloudbuild.api.yaml \
            --substitutions "_IMAGE=$IMAGE_API" \
            .
        env:
          IMAGE_API: ${{ secrets.ARTIFACT_REGISTRY }}/api:${{ github.sha }}

      - name: Deploy API revision
        run: |
          # Cloud Run IAM authentication cannot be satisfied by a browser.
          # Disable that edge check without adding an allUsers IAM binding;
          # Firebase bearer-token authorization remains enforced in the API.
          # ^;^ switches the env delimiter so comma-bearing origin lists remain
          # one variable rather than being split by gcloud.
          gcloud run deploy "$API_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "$IMAGE_API" \
            --region "$GCP_REGION" \
            --service-account permissa-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --no-invoker-iam-check \
            --timeout 300 \
            --max-instances 3 \
            --min-instances 0 \
            --set-env-vars "^;^NODE_ENV=production;PERMISSA_ALLOW_DEV_TOKENS=false;PERMISSA_REQUIRE_DURABLE_STORE=true;FIRESTORE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }};FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID;GCP_REGION=$GCP_REGION;VERTEX_LOCATION=$GCP_REGION;PERMISSA_ALLOWED_ORIGINS=${{ vars.CONSOLE_ORIGIN }};GEMINI_ENABLED=true;PARALLEL_ENABLED=true;GRAFANA_MCP_ENABLED=false;RUN_ENTITY_CAP=50;RUN_PARALLEL_CALL_CAP=50;ENTITY_PARALLEL_CALL_CAP=3;RUN_DEADLINE_SECONDS=600;RUN_COST_CAP_USD=10.00;AGGREGATE_PREDEMO_CAP_USD=80;MAX_CONCURRENT_RUNS=1;USER_DAILY_RUN_LIMIT=3;GLOBAL_DAILY_RUN_LIMIT=25" \
            --set-secrets "GEMINI_API_KEY=gemini-api-key:latest,PARALLEL_API_KEY=parallel-api-key:latest"
        env:
          IMAGE_API: ${{ secrets.ARTIFACT_REGISTRY }}/api:${{ github.sha }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13

      - name: Deploy Firestore rules and indexes
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --non-interactive

      - name: Assert no plaintext secrets on the service spec
        run: |
          gcloud run services describe "$API_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$GCP_REGION" \
            --format 'value(spec.template.spec.containers[0].env)' > env.txt
          if grep -Eiq '(API_KEY|TOKEN|SECRET|PASSWORD)=[^ ]' env.txt; then
            echo "A credential appears as a literal value on the service spec." >&2
            exit 1
          fi

      - name: Verify API health
        run: |
          URL="$(gcloud run services describe "$API_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$GCP_REGION" --format 'value(status.url)')"
          curl --fail --silent --show-error --max-time 30 "$URL/v1/health"
          echo "api_url=$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Record release evidence
        run: echo "revision=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
