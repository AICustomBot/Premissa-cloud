name: Deploy API

# Option A API topology:
#   Console (login)  -> Cloud Run (static bundle, no secrets)
#   Dashboard        -> deploy-web.yml, Cloud Run, no secrets
#   API              -> this workflow, Cloud Run, us-central1
#   Firestore        -> separate manual deploy-firestore.yml workflow
#
# Firestore is intentionally not deployed here. A rules/index failure must
# never obscure or roll back a healthy API revision.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "packages/policy/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "cloudbuild.api.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  FIRESTORE_DATABASE_ID: premissadb
  API_SERVICE: permissa-api
  WEB_SERVICE: permissa-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Fail fast on missing configuration
        run: |
          missing=""
          [ -n "${{ secrets.GCP_PROJECT_ID }}" ] || missing="$missing GCP_PROJECT_ID"
          [ -n "${{ secrets.ARTIFACT_REGISTRY }}" ] || missing="$missing ARTIFACT_REGISTRY"
          [ -n "${{ vars.CONSOLE_ORIGIN }}" ] || missing="$missing CONSOLE_ORIGIN"
          if [ -n "$missing" ]; then
            echo "Missing required configuration:$missing" >&2
            exit 1
          fi

      # The dashboard is a second Cloud Run origin, so it must be in the CORS
      # allowlist and it is the target the console forwards to after sign-in.
      # Both values are resolved from the live service rather than kept in a
      # repository variable: the env string below is applied with
      # --set-env-vars, which replaces the whole block, so anything not
      # recomputed here would be dropped on every API deploy.
      #
      # An absent dashboard is not an error. PERMISSA_WEB_APP_URL then resolves
      # empty, HandoffService returns a null dashboardUrl, and the console
      # stays put instead of forwarding into a 404.
      - name: Resolve dashboard origin when deployed
        id: web
        run: |
          URL="$(gcloud run services describe "$WEB_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$GCP_REGION" \
            --format 'value(status.url)' 2>/dev/null || true)"
          ORIGINS="${{ vars.CONSOLE_ORIGIN }}"
          if [ -n "$URL" ]; then
            ORIGINS="$ORIGINS,$URL"
            echo "Dashboard origin: $URL"
          else
            echo "::notice::$WEB_SERVICE is not deployed yet. The console will not forward to a dashboard until Deploy Web Dashboard has run."
          fi
          echo "web_url=$URL" >> "$GITHUB_OUTPUT"
          echo "allowed_origins=$ORIGINS" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        run: |
          gcloud builds submit \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$GCP_REGION" \
            --config cloudbuild.api.yaml \
            --substitutions "_IMAGE=$IMAGE_API" \
            .
        env:
          IMAGE_API: ${{ secrets.ARTIFACT_REGISTRY }}/api:${{ github.sha }}

      # GOOGLE_CLOUD_PROJECT is set explicitly: Cloud Run does not provide it,
      # and Firebase Admin needs a project id to validate an ID token's
      # audience. Without it every genuine token is rejected as AUTH_REQUIRED.
      - name: Deploy API revision
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "$IMAGE_API" \
            --region "$GCP_REGION" \
            --service-account permissa-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --no-invoker-iam-check \
            --timeout 300 \
            --max-instances 3 \
            --min-instances 0 \
            --set-env-vars "^;^NODE_ENV=production;PERMISSA_ALLOW_DEV_TOKENS=false;PERMISSA_REQUIRE_DURABLE_STORE=true;GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }};FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }};FIRESTORE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }};FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID;GCP_REGION=$GCP_REGION;VERTEX_LOCATION=$GCP_REGION;PERMISSA_ALLOWED_ORIGINS=${ALLOWED_ORIGINS};PERMISSA_WEB_APP_URL=${WEB_APP_URL};GEMINI_ENABLED=true;PARALLEL_ENABLED=true;GRAFANA_MCP_ENABLED=false;RUN_ENTITY_CAP=50;RUN_PARALLEL_CALL_CAP=50;ENTITY_PARALLEL_CALL_CAP=3;RUN_DEADLINE_SECONDS=600;RUN_COST_CAP_USD=10.00;AGGREGATE_PREDEMO_CAP_USD=80;MAX_CONCURRENT_RUNS=1;USER_DAILY_RUN_LIMIT=3;GLOBAL_DAILY_RUN_LIMIT=25" \
            --set-secrets "GEMINI_API_KEY=gemini-api-key:latest,PARALLEL_API_KEY=parallel-api-key:latest"
        env:
          IMAGE_API: ${{ secrets.ARTIFACT_REGISTRY }}/api:${{ github.sha }}
          ALLOWED_ORIGINS: ${{ steps.web.outputs.allowed_origins }}
          WEB_APP_URL: ${{ steps.web.outputs.web_url }}

      - name: Assert no plaintext secrets on the service spec
        run: |
          gcloud run services describe "$API_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$GCP_REGION" \
            --format 'value(spec.template.spec.containers[0].env)' > env.txt
          if grep -Eiq '(API_KEY|TOKEN|SECRET|PASSWORD)=[^ ]' env.txt; then
            echo "A credential appears as a literal value on the service spec." >&2
            exit 1
          fi

      - name: Verify API health
        run: |
          URL="$(gcloud run services describe "$API_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$GCP_REGION" --format 'value(status.url)')"
          curl --fail --silent --show-error --max-time 30 "$URL/v1/health"
          echo "api_url=$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Record release evidence
        run: echo "revision=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
